<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirra — Daily Affirmations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --ink: #171B2A;
    --ink-2: #2A2F40;
    --muted: #6B6F7E;
    --muted-2: #9AA0AE;
    --chip: #ECE9F5;
    --chip-line: #DDD8EC;
    --line: #ECE7DE;
    --line-2: #E5DFD3;
    --accent-a: #B79DE8;
    --accent-b: #F0B2A3;
    --accent-c: #F8D2A8;
    --ok: #2BB673;
    --danger: #E25C5C;
    --grad: linear-gradient(120deg, #B79DE8 0%, #E0AECB 50%, #F0B2A3 100%);
    --grad-soft: linear-gradient(135deg, #EDE3F8 0%, #FBE2D9 100%);
  }
  html, body { margin:0; padding:0; background:#E9E4DA; }
  body {
    min-height:100vh;
    font-family:'Geist', -apple-system, system-ui, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  ::selection { background: #B79DE8; color: #fff; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* utility */
  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; letter-spacing: 0.005em; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .grad-text {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .no-tap { -webkit-tap-highlight-color: transparent; }
  /* page enter */
  @keyframes fadeIn { from { opacity:1; transform: none;} to {opacity:1; transform:none;} }
  @keyframes fadeInSlow { from { opacity:1;} to {opacity:1;} }
  @keyframes popIn { 0%{opacity:1; transform: scale(1);} 100%{opacity:1; transform: scale(1);} }
  @keyframes slideUp { from {transform: translateY(0);} to {transform: translateY(0);} }
  @keyframes shimmer { 0% {background-position: 200% 0;} 100% {background-position: -200% 0;} }
  .anim-fade { animation: fadeIn 360ms cubic-bezier(.2,.7,.2,1) both; }
  .anim-fadeslow { animation: fadeInSlow 700ms ease-out both; }
  .anim-pop { animation: popIn 260ms cubic-bezier(.2,.8,.3,1.2) both; }
  .anim-slideup { animation: slideUp 320ms cubic-bezier(.2,.8,.2,1) both; z-index: 40; }
  /* button reset */
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="mirra-data.jsx"></script>
  <script type="text/babel" src="mirra-icons.jsx"></script>
  <script type="text/babel" src="mirra-primitives.jsx"></script>
  <script type="text/babel" src="mirra-onboarding.jsx"></script>
  <script type="text/babel" src="mirra-home.jsx"></script>
  <script type="text/babel" src="mirra-library.jsx"></script>
  <script type="text/babel" src="mirra-profile.jsx"></script>
  <script type="text/babel" src="mirra-preferences.jsx"></script>
  <script type="text/babel" src="mirra-app.jsx"></script>
</body>
</html>
