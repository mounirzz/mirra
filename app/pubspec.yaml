name: mirra
description: "Mirra — Daily affirmations and inspirational quotes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.2
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  screenshot: ^3.0.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Auth (Cognito Hosted UI OAuth + PKCE) and account-tied theme sync.
  flutter_web_auth_2: ^4.1.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  http: ^1.2.2

  # iOS home/lock-screen widgets (shares the daily affirmation via an App Group).
  home_widget: ^0.7.0
  flutter_dynamic_icon_plus: ^1.4.0

  # Read affirmations aloud with a selectable voice.
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/photos/
    - assets/icons/

  fonts:
    - family: CarmenSans
      fonts:
        - asset: assets/fonts/CarmenSans-ExtraBold.ttf
          weight: 800
